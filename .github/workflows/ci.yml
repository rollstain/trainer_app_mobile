name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Статический анализ
        run: ./gradlew detekt --console=plain

      - name: Юнит-тесты
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain

      - name: Debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Отчёты о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: androidApp/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS — компиляция общего кода
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Фреймворк для симулятора
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain
