name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      buildType:
        description: Тип сборки
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android — сборка и отправка в Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.buildType || 'release' }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Версия и список изменений
        id: meta
        run: ./scripts/release_meta.sh release-notes.txt

      - name: Ключ подписи
        if: env.BUILD_TYPE == 'release'
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Нет секрета KEYSTORE_BASE64 — релизный APK подписать нечем" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Юнит-тесты
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain

      - name: Сборка APK
        env:
          TRAINER_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TRAINER_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TRAINER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TRAINER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          task=":androidApp:assemble${BUILD_TYPE^}"
          ./gradlew "$task" --console=plain \
            -Ptrainer.versionName=${{ steps.meta.outputs.version }} \
            -Ptrainer.versionCode=${{ steps.meta.outputs.version_code }}

      - name: Проверка подписи
        if: env.BUILD_TYPE == 'release'
        run: |
          build_tools=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs \
            androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Имя файла сборки
        id: apk
        run: |
          source_apk=$(find "androidApp/build/outputs/apk/$BUILD_TYPE" -name '*.apk' -print -quit)
          cp "$source_apk" "${{ steps.meta.outputs.apk_name }}"
          echo "path=${{ steps.meta.outputs.apk_name }}" >> "$GITHUB_OUTPUT"

      - name: Артефакт прогона
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Отправка в Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            kind="релиз"
          else
            kind="дебаг"
          fi
          title="trainer_app ${{ steps.meta.outputs.version }} · $kind"
          ./scripts/telegram_send_build.sh "${{ steps.apk.outputs.path }}" "$title" release-notes.txt

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes-file release-notes.txt
