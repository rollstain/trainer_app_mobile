name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android — релизный APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Юнит-тесты
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain

      - name: Release APK
        run: ./gradlew :androidApp:assembleRelease --console=plain

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: trainer-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
