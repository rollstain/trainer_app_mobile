[versions]

android-minSdk = "26"
android-compileSdk = "36"
android-targetSdk = "36"

agp = "8.12.0"
googleServices = "4.4.2"
kotlin = "2.3.0"
compose-plugin = "1.10.2"
detekt = "1.23.6"
robolectric = "4.14.1"
androidx-compose-ui = "1.10.4"

coroutines = "1.11.0"
kotlinx-serialization = "1.8.1"
